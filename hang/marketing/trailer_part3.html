<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{ --bg:#060910; --cyan:#4ad8ff; --mag:#ff4ad1; --red:#ff4a5e; --dim:#7d8aa0; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:414px; height:896px; overflow:hidden; background:var(--bg); font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;}
  #stage{position:relative; width:414px; height:896px; background:
    radial-gradient(circle at 30% 70%, rgba(255,74,94,0.10), transparent 55%),
    radial-gradient(circle at 75% 20%, rgba(74,216,255,0.08), transparent 55%),
    var(--bg);}
  .scanlines{position:absolute; inset:0; pointer-events:none; opacity:.06;
    background:repeating-linear-gradient(to bottom, #fff 0px, #fff 1px, transparent 1px, transparent 3px);}
  .vignette{position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 160px 60px rgba(0,0,0,.65);}
  .scene{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; transition:opacity .5s ease; padding:40px 32px; text-align:center;}
  .scene.active{opacity:1;}
  .sub{margin-top:26px; font-size:19px; color:#e9eefb; line-height:1.5; max-width:300px; font-weight:500;}

  .ptt-wrap{position:relative; width:140px; height:140px; display:flex; align-items:center; justify-content:center;}
  .ring{position:absolute; border-radius:50%; border:2px solid var(--red); opacity:0;
    width:140px; height:140px; animation:ringpulse 1.6s ease-out infinite;}
  .ring.r2{animation-delay:.5s;}
  .ring.r3{animation-delay:1s;}
  @keyframes ringpulse{
    0%{ transform:scale(.5); opacity:.9; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  .ptt-btn{width:92px; height:92px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8a98, var(--red) 60%, #a8202f);
    box-shadow:0 0 30px rgba(255,74,94,.65), inset 0 2px 8px rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center; font-size:34px;}

  .logo{font-size:58px; font-weight:900; letter-spacing:.02em; color:#fff;
    text-shadow:0 0 24px rgba(74,216,255,.6), 0 0 60px rgba(255,74,209,.3);}
  .tagline{margin-top:14px; font-size:17px; color:var(--dim); font-style:italic;}
  .cta{margin-top:40px; font-size:14px; letter-spacing:.3em; text-transform:uppercase; color:var(--cyan);
    border:1px solid rgba(74,216,255,.4); padding:12px 26px; border-radius:30px; box-shadow:0 0 18px rgba(74,216,255,.2);}

  #progress{position:absolute; top:18px; left:24px; right:24px; height:3px; display:flex; gap:5px;}
  #progress div{flex:1; background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden;}
  #progress div span{display:block; height:100%; width:0%; background:var(--red); box-shadow:0 0 6px var(--red);}
  #progress div.done span{width:100%;}
  #progress div.cur span{animation:fillbar linear forwards;}
  @keyframes fillbar{from{width:0%} to{width:100%}}
</style>
</head>
<body>
<div id="stage">
  <div class="scanlines"></div>
  <div id="progress"></div>

  <div class="scene" id="p0">
    <div class="ptt-wrap">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="ptt-btn">&#127908;</div>
    </div>
    <div class="sub">And if someone nearby's doing the&nbsp;same&nbsp;thing &mdash;<br><strong>just talk.</strong></div>
  </div>

  <div class="scene" id="p1">
    <div class="logo">HANG</div>
    <div class="tagline">"Show up. On your terms."</div>
    <div class="cta">Coming soon</div>
  </div>

  <div class="vignette"></div>
</div>
<script>
  const scenes = ['p0','p1'];
  const durations = [5200, 5000];
  const prog = document.getElementById('progress');
  scenes.forEach(()=>{ const d=document.createElement('div'); const s=document.createElement('span'); d.appendChild(s); prog.appendChild(d); });
  const bars = prog.children;
  let i = 0;
  function show(idx){
    scenes.forEach((id,k)=>{
      document.getElementById(id).classList.toggle('active', k===idx);
      bars[k].classList.toggle('done', k<idx);
      bars[k].classList.toggle('cur', k===idx);
      if (k===idx) bars[k].querySelector('span').style.animationDuration = durations[idx]+'ms';
    });
  }
  function next(){
    show(i);
    if (i < scenes.length-1){ setTimeout(()=>{ i++; next(); }, durations[i]); }
    else { window.__done = true; }
  }
  next();
</script>
</body>
</html>
