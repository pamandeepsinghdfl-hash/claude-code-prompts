# ─── Global YouTube Shorts Factory — config ───────────────────────────────
# Anything in this file can be overridden at runtime via CLI flags.

schedule:
  # Daily orchestrator runs at this UTC time
  run_at_utc: "00:00"
  # Algorithm-cracked plan: 6 Shorts/day series format (Part 1/6 → 6/6)
  shorts_per_day: 6
  # Even-spaced publish slots (UTC). Must contain `shorts_per_day` entries.
  # Posting-time consistency = algorithm signal #6.
  publish_slots_utc:
    - "04:00"
    - "08:00"
    - "12:00"
    - "16:00"
    - "20:00"
    - "00:00"   # next day midnight
  privacy_status: "private"   # private | public | unlisted (will flip to public via publishAt)

# ─── Hero niches (algorithm signal #4: returning_viewer_ratio) ────────────
# Lock to 3 hero niches that rotate by DAY (not by slot). All 6 daily
# Shorts share one niche → returning viewers, audience identity, and a
# clean topic-cluster signal for the algorithm.
niches:
  - viral_interviews_podcasts
  - mind_blowing_facts
  - inspiring_stories

# ─── Global sourcing config ───────────────────────────────────────────────
sourcing:
  lookback_days: 7
  max_candidates_per_region: 25
  # YouTube Data API regionCode list — geographically diverse.
  region_codes:
    - US   # United States
    - IN   # India
    - BR   # Brazil
    - ID   # Indonesia
    - MX   # Mexico
    - JP   # Japan
    - KR   # South Korea
    - SA   # Saudi Arabia
    - GB   # United Kingdom
    - DE   # Germany
    - FR   # France
    - NG   # Nigeria
    - PH   # Philippines
    - EG   # Egypt
    - TR   # Turkey
  # Languages we'll accept as source audio (Whisper handles all).
  source_languages: [en, hi, es, pt, id, ja, ko, ar, de, fr, tr, bn, ur, ru, zh, it]
  # YouTube categoryIds biasing the trending query
  category_ids: [22, 24, 25, 27, 28]   # People & Blogs, Entertainment, News, Education, Sci&Tech
  # Filter rules
  min_view_count: 50000
  min_duration_seconds: 60
  max_duration_seconds: 7200
  exclude_keywords:
    - "official music video"
    - "trailer"
    - "movie clip"
    - "wwe"
    - "live stream"
    - "live cricket"

# ─── Copyright safety ─────────────────────────────────────────────────────
copyright:
  # Algorithm-cracked plan: tighter safety floor (was 65). Strikes
  # tank ranking + risk channel termination — both ruin the math.
  min_safety_score: 80
  prefer_licenses:
    - "creativeCommon"   # YouTube videoLicense value
  # If best candidate score < threshold, fall back to public-domain factory.
  fallback_below_score: 70

# ─── Viral scoring weights ────────────────────────────────────────────────
# Rebalanced: hook strength is the #1 driver of breakout probability, so
# we weight it heaviest. Engagement velocity (signal #5) matters more
# than raw view count for predicting algorithm love.
viral:
  weight_views: 0.20
  weight_engagement_velocity: 0.30
  weight_cross_cultural: 0.20
  weight_hook_strength: 0.30         # was 0.20 — reward LLM-rated hooks more
  min_score: 60

# ─── Clip selection (viral moment detection) ──────────────────────────────
clip:
  target_duration_seconds: 38
  min_duration_seconds: 18
  max_duration_seconds: 55
  # How many candidate moments the LLM should propose per source video
  candidates_per_source: 5    # was 3 — wider net = better hook picks

# ─── Captions (mandatory English, TikTok-style) ───────────────────────────
captions:
  language: "en"               # ALWAYS English output, regardless of source
  translate_if_not_english: true
  style:
    font: "Montserrat-Black.ttf"     # bundled in data/fonts
    font_size: 80                    # bigger = better mobile retention
    stroke_color: "black"
    stroke_width: 8                  # was 6 — more pop on small screens
    fill_color: "white"
    highlight_color: "#FFD400"       # active-word highlight (karaoke)
    position: "center"               # center | bottom | top
    max_chars_per_line: 20           # tighter line = easier on eyes
    max_lines: 2
    fade_ms: 60
    pop_scale: 1.18                  # was 1.12 — more aggressive entrance anim
  safe_margin_px: 80               # top/bottom safe area for mobile

# ─── Video output ─────────────────────────────────────────────────────────
video:
  width: 1080
  height: 1920
  fps: 30
  bitrate: "8M"
  codec: "libx264"
  audio_codec: "aac"
  audio_bitrate: "192k"
  # Subtle motion
  ken_burns: true
  ken_burns_zoom: 0.06
  # Transitions
  transition_ms: 180
  # Background music
  music_volume: 0.10            # original audio stays at 1.0
  music_dir: "data/music"
  # Watermark / channel handle (small, top-right, semi-transparent)
  watermark_text: "@pixelhours"

# ─── Thumbnail ────────────────────────────────────────────────────────────
thumbnail:
  width: 1080
  height: 1920
  background_blur: 30
  title_font: "Montserrat-Black.ttf"
  title_font_size: 110
  title_max_chars: 28
  title_stroke_width: 8

# ─── Metadata (title / description) ───────────────────────────────────────
metadata:
  title_max_chars: 90
  title_must_include_emoji: true
  description_template: |
    {summary}

    🌙 Pixel Hours — cozy pixel-art loops, daily.
    📺 6 new Shorts every day · 04:00 / 08:00 / 12:00 / 16:00 / 20:00 / 00:00 UTC
    👉 Subscribe → https://youtube.com/@pixelhours

    All scenes are original pixel-art compositions with CC0 lofi music.

    {hashtags}
  default_hashtags:
    - "#Shorts"
    - "#PixelHours"
    - "#PixelArt"
    - "#Lofi"
    - "#Cozy"
    - "#Aesthetic"

# ─── Fallback (when no copyright-safe source is found) ────────────────────
fallback:
  stories_file: "data/public_domain_stories.json"
  use_ai_voice: true
  ai_voice: "en-US-AriaNeural"     # edge-tts voice id
  stock_footage_dir: "data/stock_footage"
  # If empty, factory will use Pixabay API (requires PIXABAY_API_KEY).

# ─── Persistence ──────────────────────────────────────────────────────────
persistence:
  db_path: "data/factory.db"
  # Refuse to publish a source twice within N days
  dedupe_window_days: 60

# ─── Logging ──────────────────────────────────────────────────────────────
logging:
  dir: "logs"
  daily_report: true
  # When True, also writes a JSON summary per run
  json_report: true
