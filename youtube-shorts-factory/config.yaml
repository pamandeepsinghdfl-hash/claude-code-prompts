# ─── Global YouTube Shorts Factory — config ───────────────────────────────
# Anything in this file can be overridden at runtime via CLI flags.

schedule:
  # Daily orchestrator runs at this UTC time
  run_at_utc: "00:00"
  # Number of Shorts produced + scheduled per day
  shorts_per_day: 4
  # Even-spaced publish slots (UTC). Must contain `shorts_per_day` entries.
  publish_slots_utc:
    - "06:00"
    - "12:00"
    - "18:00"
    - "00:00"   # next day midnight
  privacy_status: "private"   # private | public | unlisted (will flip to public via publishAt)

# ─── Niches the factory rotates through ───────────────────────────────────
# One niche per slot, in order. If fewer niches than slots, list wraps.
niches:
  - motivation_life_lessons
  - mind_blowing_facts
  - viral_interviews_podcasts
  - inspiring_stories
  - history_and_myths
  - science_breakthroughs
  - global_news_explainers

# ─── Global sourcing config ───────────────────────────────────────────────
sourcing:
  lookback_days: 7
  max_candidates_per_region: 25
  # YouTube Data API regionCode list — geographically diverse.
  region_codes:
    - US   # United States
    - IN   # India
    - BR   # Brazil
    - ID   # Indonesia
    - MX   # Mexico
    - JP   # Japan
    - KR   # South Korea
    - SA   # Saudi Arabia
    - GB   # United Kingdom
    - DE   # Germany
    - FR   # France
    - NG   # Nigeria
    - PH   # Philippines
    - EG   # Egypt
    - TR   # Turkey
  # Languages we'll accept as source audio (Whisper handles all).
  source_languages: [en, hi, es, pt, id, ja, ko, ar, de, fr, tr, bn, ur, ru, zh, it]
  # YouTube categoryIds biasing the trending query
  category_ids: [22, 24, 25, 27, 28]   # People & Blogs, Entertainment, News, Education, Sci&Tech
  # Filter rules
  min_view_count: 50000
  min_duration_seconds: 60
  max_duration_seconds: 7200
  exclude_keywords:
    - "official music video"
    - "trailer"
    - "movie clip"
    - "wwe"
    - "live stream"
    - "live cricket"

# ─── Copyright safety ─────────────────────────────────────────────────────
copyright:
  # 0–100. Lower the bar to accept more (riskier) sources.
  min_safety_score: 65
  prefer_licenses:
    - "creativeCommon"   # YouTube videoLicense value
  # If best candidate score < threshold, fall back to public-domain factory.
  fallback_below_score: 55

# ─── Viral scoring weights ────────────────────────────────────────────────
viral:
  weight_views: 0.30
  weight_engagement_velocity: 0.30   # (likes+comments)/age_hours
  weight_cross_cultural: 0.20        # appears trending across >=2 regions
  weight_hook_strength: 0.20         # LLM-rated hook potency
  min_score: 55

# ─── Clip selection (viral moment detection) ──────────────────────────────
clip:
  target_duration_seconds: 45
  min_duration_seconds: 18
  max_duration_seconds: 60
  # How many candidate moments the LLM should propose per source video
  candidates_per_source: 3

# ─── Captions (mandatory English, TikTok-style) ───────────────────────────
captions:
  language: "en"               # ALWAYS English output, regardless of source
  translate_if_not_english: true
  style:
    font: "Montserrat-Black.ttf"     # bundled in data/fonts
    font_size: 72
    stroke_color: "black"
    stroke_width: 6
    fill_color: "white"
    highlight_color: "#FFD400"       # active-word highlight (karaoke)
    position: "center"               # center | bottom | top
    max_chars_per_line: 22
    max_lines: 2
    fade_ms: 80
    pop_scale: 1.12                  # micro pop on word boundary
  safe_margin_px: 80               # top/bottom safe area for mobile

# ─── Video output ─────────────────────────────────────────────────────────
video:
  width: 1080
  height: 1920
  fps: 30
  bitrate: "8M"
  codec: "libx264"
  audio_codec: "aac"
  audio_bitrate: "192k"
  # Subtle motion
  ken_burns: true
  ken_burns_zoom: 0.06
  # Transitions
  transition_ms: 180
  # Background music
  music_volume: 0.10            # original audio stays at 1.0
  music_dir: "data/music"
  # Watermark / channel handle (optional, leave empty to disable)
  watermark_text: ""

# ─── Thumbnail ────────────────────────────────────────────────────────────
thumbnail:
  width: 1080
  height: 1920
  background_blur: 30
  title_font: "Montserrat-Black.ttf"
  title_font_size: 110
  title_max_chars: 28
  title_stroke_width: 8

# ─── Metadata (title / description) ───────────────────────────────────────
metadata:
  title_max_chars: 90
  title_must_include_emoji: true
  description_template: |
    {summary}

    🎬 Original video: {source_url}
    🕒 Clip from {clip_start}–{clip_end} of original
    🎙️ Credit: {creator_name} ({country} · {language})

    👉 Subscribe for daily viral Shorts from around the world!

    {hashtags}
  default_hashtags:
    - "#Shorts"
    - "#Viral"
    - "#GlobalWisdom"
    - "#LifeLessons"
    - "#Motivation"
    - "#Trending"

# ─── Fallback (when no copyright-safe source is found) ────────────────────
fallback:
  stories_file: "data/public_domain_stories.json"
  use_ai_voice: true
  ai_voice: "en-US-AriaNeural"     # edge-tts voice id
  stock_footage_dir: "data/stock_footage"
  # If empty, factory will use Pixabay API (requires PIXABAY_API_KEY).

# ─── Persistence ──────────────────────────────────────────────────────────
persistence:
  db_path: "data/factory.db"
  # Refuse to publish a source twice within N days
  dedupe_window_days: 60

# ─── Logging ──────────────────────────────────────────────────────────────
logging:
  dir: "logs"
  daily_report: true
  # When True, also writes a JSON summary per run
  json_report: true
