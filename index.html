<!--
  FLOOR — rebuilt
  ----------------
  What changed from the previous build, and why:

  1. DATA SAFETY. Everything still lives in localStorage only (nothing leaves the
     device), but there is now a real Export / Import backup in Settings, a
     version field + migration hook so future changes can't silently corrupt old
     saves, and a recovery path: if the saved JSON is ever unreadable, the raw
     bytes are copied to a separate "floor-state-corrupt-backup" key before the
     app resets, instead of just losing it.
  2. CRASH SAFETY. The whole app now renders inside an error boundary. A bug
     that used to white-screen the page now shows a real "something broke,
     your data is fine, reload" screen instead.
  3. TIMER SAFETY. The "out the door" run timer and the urge-delay timer are
     now written into the saved state (not just component state), so
     backgrounding the tab mid-run — the single most likely moment for this to
     happen — doesn't silently lose the session.
  4. React/ReactDOM (18.2.0, fetched straight from the npm registry) are
     vendored inline as plain script tags — same as before, on purpose: an
     external CDN script tag is one more thing that can fail in restrictive
     in-app webviews/previews, so this stays fully self-contained with zero
     network dependency once the file itself is loaded.
  5. The craving tracker's label is now editable in Settings instead of being
     hardcoded to "Weed" everywhere, so this can track any substance/habit.

  What's still a real limitation, on purpose — not fixed here because a
  browser PWA cannot fix it: reliable notifications when the app is fully
  closed. iOS Safari suspends background tabs; there is no way around that
  without wrapping this in a native shell (Capacitor/Expo) and registering
  real scheduled local notifications. The in-app reminder below only fires
  while the tab is open or recently backgrounded — it says so honestly in
  the Settings copy rather than pretending otherwise.
-->

   export/import backup (this is the #1 fix from the last review: previously
   one bad localStorage write meant total, silent, unrecoverable loss).
   ========================================================================= */

const STORE_KEY = "floor-state";
const BACKUP_KEY = "floor-state-corrupt-backup";
const STATE_VERSION = 3;

const DEFAULTS = {
  version: STATE_VERSION,
  wakeTarget: "07:30",
  eveningTime: "21:00",
  remindersOn: false,
  days: {},
  unlocked: [],
  pending: [],
  urgesRidden: 0,
  why: "",
  fb: true,
  installDismissed: false,
  lastFired: {},
  goActivity: "run",
  goSessions: 0,
  promises: {},
  promisesKept: 0,
  slipsHandled: 0,
  name: "Pamandeep",
  cravingLabel: "Weed",
  delaySession: null,   // { endsAt } — persisted so a backgrounded tab doesn't lose the timer
  goSession: null,       // { phase, startedAt, readyEndsAt, activity }
  onboarded: false        // false only on a genuinely fresh install — shows the tutorial once
};

// Bumps state shape forward. Add a case here whenever DEFAULTS gains a new
// field that needs a non-default value carried over from old saves.
function migrate(raw) {
  let s = { ...raw };
  const v = s.version || 1;
  if (v < 2) {
    s.cravingLabel = s.cravingLabel || "Weed";
    s.delaySession = s.delaySession || null;
    s.goSession = s.goSession || null;
  }
  if (v < 3) {
    // Anyone with an existing save has already used the app — never
    // interrupt a returning person with a first-run tutorial.
    s.onboarded = true;
  }
  s.version = STATE_VERSION;
  return s;
}

function isPlausibleState(obj) {
  return !!obj && typeof obj === "object" && typeof obj.days === "object" && obj.days !== null;
}

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return { ...DEFAULTS }; }
  if (!raw) return { ...DEFAULTS };
  try {
    const parsed = JSON.parse(raw);
    if (!isPlausibleState(parsed)) throw new Error("unexpected shape");
    return { ...DEFAULTS, ...migrate(parsed) };
  } catch (e) {
    // Don't just drop it — keep the unreadable bytes around under a separate
    // key in case there's something recoverable in there, then start clean.
    try { localStorage.setItem(BACKUP_KEY, raw); } catch (e2) {}
    return { ...DEFAULTS, _recoveredFromCorruption: true };
  }
}

function downloadBackup(state) {
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `floor-backup-${dkey()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { return false; }
}

function parseBackupFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!isPlausibleState(parsed)) throw new Error("This file doesn't look like a FLOOR backup.");
        resolve({ ...DEFAULTS, ...migrate(parsed) });
      } catch (e) { reject(e); }
    };
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.readAsText(file);
  });
}

class ErrorBoundary extends React.Component {
