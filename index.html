<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0c12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hangout" />
<title>Hangout — who's around</title>
<style>
  :root{
    --bg:#0a0c12; --panel:#111319; --panel2:#151822; --border:rgba(255,255,255,0.1);
    --text:#ffffff; --dim:rgba(255,255,255,0.5); --dim2:rgba(255,255,255,0.3);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden; height:100vh; height:100dvh;
  }
  #app{ position:relative; width:100%; height:100%; }
  button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
  input{ font-family:inherit; }
  .hidden{ display:none !important; }

  /* ---- onboarding ---- */
  .onboard-wrap{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--bg); overflow:hidden;
  }
  .glow{ position:absolute; border-radius:50%; filter:blur(90px); pointer-events:none; }
  .glow.a{ width:380px; height:380px; top:-140px; left:-140px; background:rgba(139,92,246,0.28); }
  .glow.b{ width:380px; height:380px; bottom:-140px; right:-100px; background:rgba(34,211,238,0.22); }
  .card{
    position:relative; width:100%; max-width:380px; background:rgba(255,255,255,0.06);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border);
    border-radius:28px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .brand{ display:flex; align-items:center; gap:8px; margin-bottom:4px; color:var(--dim); font-size:12px; letter-spacing:0.3em; font-weight:600; }
  .card h1{ font-size:24px; margin:4px 0 4px; letter-spacing:-0.02em; }
  .card p.sub{ color:var(--dim); font-size:14px; margin:0 0 24px; }
  label.field-label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim2); margin-bottom:8px; }
  input.text-input{
    width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:16px;
    padding:13px 16px; color:var(--text); font-size:15px; outline:none;
  }
  input.text-input::placeholder{ color:var(--dim2); }
  input.text-input:focus{ border-color:rgba(167,139,250,0.6); }
  .btn-primary{
    width:100%; padding:14px; border-radius:16px; font-weight:600; letter-spacing:0.01em;
    background:linear-gradient(90deg,#8b5cf6,#d946ef); color:#fff; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary:disabled{ opacity:0.3; }
  .avatar-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:8px; }
  .avatar-opt{
    aspect-ratio:1; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:20px; background:rgba(255,255,255,0.05);
  }
  .avatar-opt.sel{ background:rgba(139,92,246,0.3); outline:2px solid #a78bfa; transform:scale(1.05); }
  .color-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .color-dot{ width:30px; height:30px; border-radius:50%; opacity:0.7; }
  .color-dot.sel{ opacity:1; outline:2px solid #fff; transform:scale(1.12); }
  .back-link{ font-size:12px; color:var(--dim2); margin-bottom:12px; display:inline-block; }

  /* ---- map screen ---- */
  #mapScreen{ position:absolute; inset:0; }
  #mapViewport{ position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab; }
  #mapViewport.grabbing{ cursor:grabbing; }
  #mapViewport.placing{ cursor:crosshair; }
  #mapLayer{
    position:absolute; left:0; top:0; width:100%; height:100%; transform-origin:0 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(139,92,246,0.16), transparent 45%),
      radial-gradient(circle at 80% 15%, rgba(34,211,238,0.14), transparent 40%),
      radial-gradient(circle at 50% 85%, rgba(251,113,133,0.10), transparent 45%),
      #0a0c12;
  }
  #mapLayer svg{ position:absolute; inset:0; width:100%; height:100%; }
  .zone-blur{ position:absolute; border-radius:50%; filter:blur(30px); background:rgba(16,185,129,0.10); }
  .poi{ position:absolute; display:flex; align-items:center; gap:5px; transform:translate(-50%,-50%); white-space:nowrap; }
  .poi .dot{ width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,0.3); }
  .poi .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.15em; color:rgba(255,255,255,0.25); }

  .pin{ position:absolute; transform:translate(-50%,-50%); }
  .pin-btn{ position:relative; display:block; }
  .pin-ring{ position:absolute; inset:0; border-radius:50%; animation:ping 1.8s cubic-bezier(0,0,0.2,1) infinite; }
  @keyframes ping{ 0%{ transform:scale(1); opacity:0.35;} 75%,100%{ transform:scale(1.9); opacity:0; } }
  .pin-face{
    position:relative; width:44px; height:44px; border-radius:50%; border:2px solid;
    display:flex; align-items:center; justify-content:center; font-size:19px; background:#12141c;
  }
  .pin-badge{
    position:absolute; bottom:-2px; right:-2px; width:19px; height:19px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:10px; border:1px solid rgba(0,0,0,0.4);
  }
  .my-pin .pin-face{ width:48px; height:48px; border-color:#fff; box-shadow:0 0 22px rgba(255,255,255,0.35); }
  .my-tag{
    position:absolute; top:-24px; left:50%; transform:translateX(-50%); background:#fff; color:#000;
    font-size:10px; font-weight:600; padding:2px 8px; border-radius:10px; white-space:nowrap;
  }

  .top-bar{ position:absolute; top:0; left:0; right:0; padding:16px; display:flex; justify-content:space-between; z-index:30; pointer-events:none; }
  .chip{
    display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.5); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border); border-radius:999px; padding:7px 12px; font-size:12px; pointer-events:auto;
  }
  .dot-online{ width:6px; height:6px; border-radius:50%; background:#34d399; }
  .live-chip{ position:absolute; top:60px; left:16px; z-index:30; }
  .live-chip.warn{ top:96px; }

  .zoom-stack{ position:absolute; right:16px; top:50%; transform:translateY(-50%); z-index:30; display:flex; flex-direction:column; gap:8px; }
  .zbtn{
    width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.5); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:16px; color:rgba(255,255,255,0.7);
  }

  .empty-state{ position:absolute; left:32px; right:32px; top:32%; text-align:center; z-index:20; pointer-events:none; }
  .empty-state .l1{ color:var(--dim); font-size:14px; margin:0; }
  .empty-state .l2{ color:var(--dim2); font-size:12px; margin:4px 0 0; }

  .placing-banner{
    position:absolute; top:16px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15); border-radius:999px; padding:8px 16px; font-size:12px;
    display:flex; align-items:center; gap:8px; z-index:35;
  }

  .bottom-dock{ position:absolute; left:0; right:0; bottom:0; padding:40px 20px 24px; z-index:30;
    background:linear-gradient(to top, rgba(0,0,0,0.7), transparent); }
  .status-pill{
    display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.06); backdrop-filter:blur(20px);
    border:1px solid var(--border); border-radius:18px; padding:12px 16px;
  }
  .status-pill .txt{ flex:1; min-width:0; }
  .status-pill .txt p.title{ font-size:14px; font-weight:500; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status-pill .txt p.time{ font-size:11px; color:var(--dim2); margin:2px 0 0; }
  .end-btn{ font-size:12px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,0.1); color:var(--dim); }

  /* ---- modals ---- */
  .sheet-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); display:flex; align-items:flex-end; z-index:40; }
  .sheet{ width:100%; background:var(--panel); border-top:1px solid var(--border); border-radius:28px 28px 0 0; padding:22px; padding-bottom:32px; max-height:85%; overflow-y:auto; }
  .grabber{ width:38px; height:4px; background:rgba(255,255,255,0.15); border-radius:99px; margin:0 auto 18px; }
  .sheet h2{ font-size:18px; margin:0 0 16px; }
  .intent-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .intent-opt{
    display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:15px; border-radius:16px;
    background:rgba(255,255,255,0.05); border:1px solid var(--border); text-align:left;
  }
  .intent-icon{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:17px; }
  .intent-name{ font-size:13.5px; font-weight:500; }
  .note-input{
    width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:16px;
    padding:13px 16px; color:var(--text); font-size:14px; outline:none; margin:8px 0 18px;
  }
  .dur-row{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 22px; }
  .dur-chip{ padding:9px 14px; border-radius:999px; font-size:12px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--dim); }
  .dur-chip.sel{ background:rgba(139,92,246,0.25); border-color:#a78bfa; color:#fff; }
  .go-btn{ width:100%; padding:14px; border-radius:16px; font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px; }

  .detail-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .detail-head .av{ font-size:30px; }
  .detail-head .nm{ font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px; }
  .preview-tag{ font-size:10px; padding:2px 8px; border-radius:99px; background:rgba(255,255,255,0.1); color:var(--dim2); font-weight:400; }
  .detail-head .tm{ font-size:11px; color:var(--dim2); margin-top:2px; }
  .intent-tag{ display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:6px 12px; border-radius:999px; margin-bottom:10px; }
  .note-quote{ color:var(--dim); font-size:13.5px; margin:0 0 18px; }

  .toast{
    position:absolute; top:64px; left:50%; transform:translateX(-50%); background:#fff; color:#000;
    font-size:12px; font-weight:500; padding:9px 16px; border-radius:999px; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  .loading{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim2); font-size:13px; }
</style>
</head>
<body>
<div id="app"></div>

<!-- Optional live sync: Firebase Realtime Database (free Spark plan). See README for setup. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* =========================================================
   FIREBASE CONFIG — leave null to run in local demo mode.
   To go live for free:
   1. Go to https://console.firebase.google.com → Create project (no card needed).
   2. Build → Realtime Database → Create Database → start in test mode.
   3. Project settings → your apps → Web app (</>) → copy the config object below.
   4. In Realtime Database → Rules, paste: {"rules": {".read": true, ".write": true}}
      (this makes the board public/open — fine for a casual status board, don't put
      anything sensitive in it).
   ========================================================= */
const FIREBASE_CONFIG = null;
/* Example:
const FIREBASE_CONFIG = {
  apiKey: "AIza...",
  authDomain: "your-project.firebaseapp.com",
  databaseURL: "https://your-project-default-rtdb.firebaseio.com",
  projectId: "your-project",
};
*/

(function () {
  "use strict";

  // ---------- data ----------
  const INTENTS = [
    { id: "netflix", label: "Netflix & Chill", emoji: "📺", color: "#FB3E67" },
    { id: "food",    label: "Share Food",      emoji: "🍽️", color: "#F5A524" },
    { id: "talk",    label: "Just Talk",       emoji: "💬", color: "#38BDF8" },
    { id: "meet",    label: "Let's Meet",      emoji: "🤝", color: "#A78BFA" },
    { id: "chill",   label: "Chill Vibes",     emoji: "☕", color: "#2DD4BF" },
    { id: "smoke",   label: "Smoke Sesh",      emoji: "💨", color: "#A3E635" },
    { id: "drink",   label: "Drinks",          emoji: "🍷", color: "#FB7185" },
  ];
  const DURATIONS = [
    { id: "30m", label: "30 min", ms: 30 * 60 * 1000 },
    { id: "1h",  label: "1 hour", ms: 60 * 60 * 1000 },
    { id: "2h",  label: "2 hours", ms: 2 * 60 * 60 * 1000 },
    { id: "tonight", label: "Tonight", ms: 6 * 60 * 60 * 1000 },
  ];
  const AVATARS = ["😎","🔥","🌙","✨","🎧","🦋","🐼","🌵","🍯","🛸","🎯","🍀"];
  const POIS = [
    { name: "Riverside Bend", x: 13, y: 58 },
    { name: "The Grid District", x: 74, y: 20 },
    { name: "Elm Hollow Park", x: 37, y: 40 },
    { name: "Old Mill Quarter", x: 82, y: 74 },
    { name: "Northgate Common", x: 55, y: 10 },
    { name: "Lowtown Strip", x: 20, y: 88 },
  ];
  const SAMPLE_PEOPLE = [
    { name: "Simran",   avatar: "😎", intentId: "netflix", note: "new season just dropped", x: 24, y: 32 },
    { name: "Jaskaran", avatar: "🔥", intentId: "food",    note: "made too much butter chicken", x: 66, y: 45 },
    { name: "Avneet",   avatar: "🌙", intentId: "talk",    note: "need to vent, got 20 min?", x: 45, y: 66 },
    { name: "Rohan",    avatar: "🎧", intentId: "chill",   note: "rooftop, bring a hoodie", x: 78, y: 55 },
    { name: "Nimrat",   avatar: "✨", intentId: "meet",    note: "downtown, coffee run", x: 30, y: 78 },
    { name: "Deep",     avatar: "🛸", intentId: "drink",   note: "one drink turned into a whole night", x: 58, y: 30 },
  ];

  function intentOf(id) { return INTENTS.find((i) => i.id === id) || INTENTS[3]; }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function timeLeft(ms) {
    if (ms <= 0) return "expired";
    const mins = Math.floor(ms / 60000);
    if (mins < 60) return mins + "m left";
    const hrs = Math.floor(mins / 60), rem = mins % 60;
    return hrs + "h " + rem + "m left";
  }
  function makeDemoPins() {
    const now = Date.now();
    return SAMPLE_PEOPLE.map((p, i) => ({
      id: "demo-" + i, isDemo: true, name: p.name, avatar: p.avatar, intentId: p.intentId,
      note: p.note, x: p.x, y: p.y, waves: Math.floor(Math.random() * 4),
      createdAt: now - i * 60000, expiresAt: now + (3 + i) * 60 * 60 * 1000,
    }));
  }

  // ---------- storage layer (Firebase live, or local demo fallback) ----------
  const LS_BOARD = "hangout_board_v1";
  const LS_PROFILE = "hangout_profile_v1";
  let live = false;
  let db = null;
  try {
    if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && window.firebase) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      live = true;
    }
  } catch (e) { live = false; }

  const Store = {
    getProfile() {
      try { return JSON.parse(localStorage.getItem(LS_PROFILE)); } catch (e) { return null; }
    },
    saveProfile(p) {
      try { localStorage.setItem(LS_PROFILE, JSON.stringify(p)); } catch (e) {}
    },
    subscribeBoard(cb) {
      if (live) {
        const ref = db.ref("hangout/board");
        const handler = (snap) => cb(Object.values(snap.val() || {}));
        ref.on("value", handler);
        return () => ref.off("value", handler);
      }
      const read = () => {
        try { cb(Object.values(JSON.parse(localStorage.getItem(LS_BOARD) || "{}"))); }
        catch (e) { cb([]); }
      };
      read();
      const t = setInterval(read, 3000);
      window.addEventListener("storage", read);
      return () => { clearInterval(t); window.removeEventListener("storage", read); };
    },
    async setPin(id, pin) {
      if (live) { await db.ref("hangout/board/" + id).set(pin); return; }
      const val = JSON.parse(localStorage.getItem(LS_BOARD) || "{}");
      val[id] = pin;
      localStorage.setItem(LS_BOARD, JSON.stringify(val));
      window.dispatchEvent(new Event("storage"));
    },
    async removePin(id) {
      if (live) { await db.ref("hangout/board/" + id).remove(); return; }
      const val = JSON.parse(localStorage.getItem(LS_BOARD) || "{}");
      delete val[id];
      localStorage.setItem(LS_BOARD, JSON.stringify(val));
      window.dispatchEvent(new Event("storage"));
    },
    async bumpWave(id) {
      if (live) { await db.ref("hangout/board/" + id + "/waves").transaction((c) => (c || 0) + 1); return; }
      const val = JSON.parse(localStorage.getItem(LS_BOARD) || "{}");
      if (val[id]) { val[id].waves = (val[id].waves || 0) + 1; localStorage.setItem(LS_BOARD, JSON.stringify(val)); window.dispatchEvent(new Event("storage")); }
    },
  };

  // ---------- state ----------
  const S = {
    screen: "loading", // loading | onboard | main
    onboardStep: 0,
    nameDraft: "", avatarDraft: AVATARS[0], colorDraft: INTENTS[3].color,
    profile: null,
    board: [],
    demoPins: makeDemoPins(),
    zoom: 1, pan: { x: 0, y: 0 },
    placing: false, composerOpen: false,
    pendingIntent: null, note: "", duration: DURATIONS[1],
    selectedPinId: null,
    toast: null,
  };
  let unsubBoard = null;
  let toastTimer = null;

  function showToast(msg) {
    S.toast = msg; render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { S.toast = null; render(); }, 2200);
  }

  function allOthers() {
    const liveOthers = S.profile ? S.board.filter((p) => p.id !== S.profile.id) : S.board;
    const activeDemo = S.demoPins.filter((p) => p.expiresAt > Date.now());
    return liveOthers.concat(activeDemo);
  }
  function myPin() { return S.profile ? S.board.find((p) => p.id === S.profile.id) : null; }
  function findPin(id) {
    if (S.profile && myPin() && myPin().id === id) return myPin();
    return allOthers().find((p) => p.id === id) || null;
  }

  // ---------- init ----------
  function init() {
    const p = Store.getProfile();
    if (p) S.profile = p;
    unsubBoard = Store.subscribeBoard((arr) => {
      const now = Date.now();
      S.board = arr.filter((p) => p.expiresAt > now);
      render();
    });
    S.screen = S.profile ? "main" : "onboard";
    render();
  }

  // ---------- actions ----------
  function completeOnboarding() {
    const p = { id: uid(), name: (S.nameDraft.trim() || "Someone").slice(0, 18), avatar: S.avatarDraft, color: S.colorDraft };
    S.profile = p;
    Store.saveProfile(p);
    S.screen = "main";
    render();
  }
  function openComposer(intent) {
    S.pendingIntent = intent; S.note = ""; S.duration = DURATIONS[1]; S.composerOpen = true; render();
  }
  function beginPlacing() {
    S.composerOpen = false; S.placing = true; render();
    showToast("Drag to look around, tap to drop your pin");
  }
  async function finalizePin(xPct, yPct) {
    if (!S.profile || !S.pendingIntent) return;
    const entry = {
      id: S.profile.id, name: S.profile.name, avatar: S.profile.avatar, userColor: S.profile.color,
      intentId: S.pendingIntent.id, note: S.note.trim().slice(0, 60), x: xPct, y: yPct, waves: 0,
      createdAt: Date.now(), expiresAt: Date.now() + S.duration.ms,
    };
    S.placing = false; S.pendingIntent = null;
    await Store.setPin(S.profile.id, entry);
    showToast("You're live on the board");
    render();
  }
  async function goOffline() {
    if (!S.profile) return;
    await Store.removePin(S.profile.id);
    S.selectedPinId = null;
    showToast("You're off the board");
    render();
  }
  async function sendWave(pin) {
    if (pin.isDemo) {
      S.demoPins = S.demoPins.map((p) => (p.id === pin.id ? Object.assign({}, p, { waves: (p.waves || 0) + 1 }) : p));
      showToast("Waved at " + pin.name);
      render();
      return;
    }
    await Store.bumpWave(pin.id);
    showToast("Waved at " + pin.name);
  }

  // ---------- render ----------
  const app = document.getElementById("app");

  function render() {
    if (S.screen === "loading") { app.innerHTML = '<div class="loading">Loading the board…</div>'; return; }
    if (S.screen === "onboard") { app.innerHTML = renderOnboard(); bindOnboard(); return; }
    app.innerHTML = renderMain(); bindMain();
  }

  function renderOnboard() {
    if (S.onboardStep === 0) {
      return `
      <div class="onboard-wrap">
        <div class="glow a"></div><div class="glow b"></div>
        <div class="card">
          <div class="brand">📡 HANGOUT</div>
          <h1>Get on the board</h1>
          <p class="sub">Drop a pin. Say what you're up for. See who's around.</p>
          <label class="field-label">What should people call you</label>
          <input id="nameInput" class="text-input" maxlength="18" placeholder="Your name" value="${esc(S.nameDraft)}" />
          <div style="height:16px"></div>
          <button id="continueBtn" class="btn-primary" ${S.nameDraft.trim() ? "" : "disabled"}>Continue</button>
        </div>
      </div>`;
    }
    return `
    <div class="onboard-wrap">
      <div class="glow a"></div><div class="glow b"></div>
      <div class="card">
        <div class="brand">📡 HANGOUT</div>
        <h1>Get on the board</h1>
        <p class="sub">Drop a pin. Say what you're up for. See who's around.</p>
        <label class="field-label">Pick a face</label>
        <div class="avatar-grid">
          ${AVATARS.map((a) => `<button class="avatar-opt ${a === S.avatarDraft ? "sel" : ""}" data-avatar="${a}">${a}</button>`).join("")}
        </div>
        <div style="height:16px"></div>
        <label class="field-label">Pin color</label>
        <div class="color-row">
          ${INTENTS.map((i) => `<button class="color-dot ${i.color === S.colorDraft ? "sel" : ""}" data-color="${i.color}" style="background:${i.color}"></button>`).join("")}
        </div>
        <div style="height:20px"></div>
        <button id="enterBtn" class="btn-primary">✨ Enter Hangout</button>
      </div>
    </div>`;
  }

  function bindOnboard() {
    if (S.onboardStep === 0) {
      const inp = document.getElementById("nameInput");
      inp.addEventListener("input", (e) => { S.nameDraft = e.target.value; document.getElementById("continueBtn").disabled = !S.nameDraft.trim(); });
      document.getElementById("continueBtn").addEventListener("click", () => { if (S.nameDraft.trim()) { S.onboardStep = 1; render(); } });
    } else {
      document.querySelectorAll(".avatar-opt").forEach((btn) => btn.addEventListener("click", () => { S.avatarDraft = btn.dataset.avatar; render(); }));
      document.querySelectorAll(".color-dot").forEach((btn) => btn.addEventListener("click", () => { S.colorDraft = btn.dataset.color; render(); }));
      document.getElementById("enterBtn").addEventListener("click", completeOnboarding);
    }
  }

  function pinHtml(pin, isMine) {
    const intent = intentOf(pin.intentId);
    if (isMine) {
      return `
      <div class="pin my-pin" style="left:${pin.x}%; top:${pin.y}%">
        <button class="pin-btn" data-pin-id="${pin.id}">
          <span class="pin-face" style="border-color:#fff">${pin.avatar}</span>
        </button>
        <span class="my-tag">You</span>
      </div>`;
    }
    return `
    <div class="pin" style="left:${pin.x}%; top:${pin.y}%">
      <button class="pin-btn" data-pin-id="${pin.id}">
        <span class="pin-ring" style="background:${intent.color};opacity:0.35"></span>
        <span class="pin-face" style="border-color:${intent.color}; box-shadow:0 0 18px ${intent.color}55">${pin.avatar}</span>
        <span class="pin-badge" style="background:${intent.color}">${intent.emoji}</span>
      </button>
    </div>`;
  }

  function renderMain() {
    const mine = myPin();
    const others = allOthers();
    const liveIntentIds = new Set([].concat(mine ? [mine.intentId] : []).concat(others.map((p) => p.intentId)));
    const total = others.length + (mine ? 1 : 0);

    const poisHtml = POIS.map((p) => `
      <div class="poi" style="left:${p.x}%; top:${p.y}%"><span class="dot"></span><span class="label">${esc(p.name)}</span></div>
    `).join("");

    const pinsHtml = others.map((p) => pinHtml(p, false)).join("") + (mine ? pinHtml(mine, true) : "");

    return `
    <div id="mapScreen">
      <div id="mapViewport" class="${S.placing ? "placing" : ""}">
        <div id="mapLayer" style="transform: translate(${S.pan.x}px, ${S.pan.y}px) scale(${S.zoom})">
          <svg preserveAspectRatio="none" style="opacity:0.1">
            ${[12,28,46,64,82].map((y) => `<line x1="0" y1="${y}%" x2="100%" y2="${y}%" stroke="white" stroke-width="1"/>`).join("")}
            ${[15,35,55,75,90].map((x) => `<line x1="${x}%" y1="0" x2="${x}%" y2="100%" stroke="white" stroke-width="1"/>`).join("")}
          </svg>
          <svg preserveAspectRatio="none" style="opacity:0.3">
            <path d="M -5 20 C 20 30, 15 45, 35 50 S 55 65, 50 75 S 60 92, 90 98" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <div class="zone-blur" style="width:180px;height:140px;top:18%;left:10%"></div>
          <div class="zone-blur" style="width:220px;height:160px;bottom:12%;right:8%"></div>
          <div class="zone-blur" style="width:140px;height:110px;top:42%;left:42%"></div>
          ${poisHtml}
          ${pinsHtml}
        </div>
      </div>

      ${S.placing ? `
      <div class="placing-banner">
        🖐️ Tap anywhere to drop your pin
        <button id="cancelPlacing" style="color:rgba(255,255,255,0.5)">✕</button>
      </div>` : ""}

      <div class="zoom-stack">
        <button class="zbtn" id="zoomIn">＋</button>
        <button class="zbtn" id="zoomOut">－</button>
        <button class="zbtn" id="recenter" style="color:#c4b5fd">◎</button>
      </div>

      <div class="top-bar">
        <div class="chip">📡 <span style="letter-spacing:0.2em;font-weight:600">HANGOUT</span></div>
        <div class="chip"><span class="dot-online"></span> ${total} on the board</div>
      </div>
      <div class="live-chip chip">✨ ${liveIntentIds.size}/${INTENTS.length} vibes live now</div>
      ${!live ? `<div class="live-chip warn chip" style="color:#fbbf24">⚠ demo mode — set up Firebase for a shared live map</div>` : ""}

      ${total === 0 && !S.placing ? `
      <div class="empty-state">
        <p class="l1">Nobody's live yet.</p>
        <p class="l2">Set your status and be the first pin.</p>
      </div>` : ""}

      <div class="bottom-dock">
        ${mine ? `
        <div class="status-pill">
          <span style="font-size:22px">${mine.avatar}</span>
          <div class="txt">
            <p class="title">${esc(intentOf(mine.intentId).label)}${mine.note ? " · " + esc(mine.note) : ""}</p>
            <p class="time">${timeLeft(mine.expiresAt - Date.now())}</p>
          </div>
          <button class="end-btn" id="endStatusBtn">End</button>
        </div>` : `
        <button id="setStatusBtn" class="btn-primary" style="box-shadow:0 10px 30px rgba(139,92,246,0.35)">＋ Set your status</button>
        `}
      </div>
    </div>

    ${S.composerOpen ? renderComposer() : ""}
    ${S.selectedPinId ? renderDetail() : ""}
    ${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ""}
    `;
  }

  function renderComposer() {
    if (!S.pendingIntent) {
      return `
      <div class="sheet-backdrop" id="composerBackdrop">
        <div class="sheet" id="composerSheet">
          <div class="grabber"></div>
          <h2>What are you up for?</h2>
          <div class="intent-grid">
            ${INTENTS.map((i) => `
              <button class="intent-opt" data-intent="${i.id}">
                <span class="intent-icon" style="background:${i.color}22">${i.emoji}</span>
                <span class="intent-name">${esc(i.label)}</span>
              </button>`).join("")}
          </div>
        </div>
      </div>`;
    }
    const i = S.pendingIntent;
    return `
    <div class="sheet-backdrop" id="composerBackdrop">
      <div class="sheet" id="composerSheet">
        <div class="grabber"></div>
        <button class="back-link" id="backToIntents">← Back</button>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
          <span class="intent-icon" style="background:${i.color}22;width:36px;height:36px;font-size:18px">${i.emoji}</span>
          <h2 style="margin:0">${esc(i.label)}</h2>
        </div>
        <label class="field-label">Add a note (optional)</label>
        <input id="noteInput" class="note-input" maxlength="60" placeholder="e.g. got snacks, bring your own drink" value="${esc(S.note)}" />
        <label class="field-label">How long are you around</label>
        <div class="dur-row">
          ${DURATIONS.map((d) => `<button class="dur-chip ${d.id === S.duration.id ? "sel" : ""}" data-dur="${d.id}">${d.label}</button>`).join("")}
        </div>
        <button id="nextPlaceBtn" class="go-btn" style="background:${i.color};color:#0a0c12">Next: drop your pin</button>
      </div>
    </div>`;
  }

  function renderDetail() {
    const pin = findPin(S.selectedPinId);
    if (!pin) return "";
    const i = intentOf(pin.intentId);
    const isMe = S.profile && pin.id === S.profile.id;
    return `
    <div class="sheet-backdrop" id="detailBackdrop">
      <div class="sheet" id="detailSheet">
        <div class="grabber"></div>
        <div class="detail-head">
          <span class="av">${pin.avatar}</span>
          <div>
            <div class="nm">${esc(pin.name)}${isMe ? " (you)" : ""}${pin.isDemo ? '<span class="preview-tag">preview</span>' : ""}</div>
            <div class="tm">${timeLeft(pin.expiresAt - Date.now())}</div>
          </div>
        </div>
        <div class="intent-tag" style="background:${i.color}22;color:${i.color}">${i.emoji} ${esc(i.label)}</div><br/>
        ${pin.note ? `<p class="note-quote">"${esc(pin.note)}"</p>` : ""}
        ${isMe
          ? `<button id="endFromDetail" class="go-btn" style="background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7)">End my status</button>`
          : `<button id="waveBtn" class="go-btn" style="background:linear-gradient(90deg,#8b5cf6,#d946ef);color:#fff">🖐 Wave${pin.waves > 0 ? " (" + pin.waves + ")" : ""}</button>`
        }
      </div>
    </div>`;
  }

  // ---------- bind main screen events ----------
  function bindMain() {
    document.getElementById("setStatusBtn") && document.getElementById("setStatusBtn").addEventListener("click", () => { S.composerOpen = true; render(); });
    document.getElementById("endStatusBtn") && document.getElementById("endStatusBtn").addEventListener("click", goOffline);
    document.getElementById("cancelPlacing") && document.getElementById("cancelPlacing").addEventListener("click", (e) => { e.stopPropagation(); S.placing = false; S.pendingIntent = null; render(); });

    document.getElementById("zoomIn") && document.getElementById("zoomIn").addEventListener("click", () => { S.zoom = clamp(+(S.zoom + 0.15).toFixed(2), 0.85, 1.8); applyTransform(); });
    document.getElementById("zoomOut") && document.getElementById("zoomOut").addEventListener("click", () => { S.zoom = clamp(+(S.zoom - 0.15).toFixed(2), 0.85, 1.8); applyTransform(); });
    document.getElementById("recenter") && document.getElementById("recenter").addEventListener("click", () => { S.zoom = 1; S.pan = { x: 0, y: 0 }; applyTransform(); showToast("Recentered"); });

    document.querySelectorAll(".pin-btn").forEach((btn) => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); S.selectedPinId = btn.dataset.pinId; render(); });
    });

    bindDragPan();

    // composer
    const backdrop = document.getElementById("composerBackdrop");
    if (backdrop) {
      backdrop.addEventListener("click", () => { S.composerOpen = false; render(); });
      document.getElementById("composerSheet").addEventListener("click", (e) => e.stopPropagation());
      document.querySelectorAll(".intent-opt").forEach((btn) => btn.addEventListener("click", () => openComposer(intentOf(btn.dataset.intent))));
      const back = document.getElementById("backToIntents");
      if (back) back.addEventListener("click", () => { S.pendingIntent = null; render(); });
      const noteInput = document.getElementById("noteInput");
      if (noteInput) noteInput.addEventListener("input", (e) => { S.note = e.target.value; });
      document.querySelectorAll(".dur-chip").forEach((btn) => btn.addEventListener("click", () => { S.duration = DURATIONS.find((d) => d.id === btn.dataset.dur); render(); }));
      const next = document.getElementById("nextPlaceBtn");
      if (next) next.addEventListener("click", beginPlacing);
    }

    // detail
    const dBackdrop = document.getElementById("detailBackdrop");
    if (dBackdrop) {
      dBackdrop.addEventListener("click", () => { S.selectedPinId = null; render(); });
      document.getElementById("detailSheet").addEventListener("click", (e) => e.stopPropagation());
      const waveBtn = document.getElementById("waveBtn");
      if (waveBtn) waveBtn.addEventListener("click", () => { const p = findPin(S.selectedPinId); if (p) sendWave(p); });
      const endBtn = document.getElementById("endFromDetail");
      if (endBtn) endBtn.addEventListener("click", goOffline);
    }
  }

  function applyTransform() {
    const layer = document.getElementById("mapLayer");
    if (layer) layer.style.transform = `translate(${S.pan.x}px, ${S.pan.y}px) scale(${S.zoom})`;
    const chip = document.querySelector(".live-chip"); // no-op, placeholder for future live readouts
  }

  // ---------- drag to pan + tap to place ----------
  function bindDragPan() {
    const viewport = document.getElementById("mapViewport");
    if (!viewport) return;
    let dragging = false, moved = false;
    let startX = 0, startY = 0, startPanX = 0, startPanY = 0;

    viewport.addEventListener("pointerdown", (e) => {
      dragging = true; moved = false;
      startX = e.clientX; startY = e.clientY;
      startPanX = S.pan.x; startPanY = S.pan.y;
      viewport.classList.add("grabbing");
      viewport.setPointerCapture && viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      S.pan.x = startPanX + dx;
      S.pan.y = startPanY + dy;
      applyTransform();
    });

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      viewport.classList.remove("grabbing");
      if (!moved && S.placing) {
        const rect = viewport.getBoundingClientRect();
        const clientX = e.clientX, clientY = e.clientY;
        const xPct = ((clientX - rect.left - S.pan.x) / (rect.width * S.zoom)) * 100;
        const yPct = ((clientY - rect.top - S.pan.y) / (rect.height * S.zoom)) * 100;
        finalizePin(clamp(xPct, 4, 96), clamp(yPct, 6, 96));
      }
    }
    viewport.addEventListener("pointerup", endDrag);
    viewport.addEventListener("pointercancel", () => { dragging = false; viewport.classList.remove("grabbing"); });
  }

  init();
})();
</script>
</body>
</html>
